name: Fantasia 2.5D V5 selective wind and lighting

on:
  push:
    branches:
      - "prototype/ai-first-home"
    paths:
      - "prototypes/gpt_zero_home/25d_interactive/v5_patch/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Package exact artwork and V5 dynamic changes in an isolated ZIP
        run: |
          set -euo pipefail
          python3 prototypes/gpt_zero_home/25d_interactive/v5_patch/tools/apply_v5_patch.py \
            prototypes/gpt_zero_home/25d_interactive/fantasia_first_home_25d_v4_ambient.zip \
            prototypes/gpt_zero_home/25d_interactive/v5_patch \
            prototypes/gpt_zero_home/25d_interactive/fantasia_first_home_25d_v5_dynamic.zip
          mkdir -p /tmp/fantasia-v5-test
          unzip -q prototypes/gpt_zero_home/25d_interactive/fantasia_first_home_25d_v5_dynamic.zip -d /tmp/fantasia-v5-test
      - name: Test local ambient dynamics and public-only boundaries
        run: |
          set -euo pipefail
          cd /tmp/fantasia-v5-test/fantasia_first_home_25d
          python3 tests/source_audit.py
          node tests/ambient_browser_smoke.mjs
          node tests/environment_v5_smoke.mjs
          bash -n tools/export_25d_web.sh
      - name: Install Godot 4.6.3 headless for parse and scene tests
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --output /tmp/godot-v5.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot-v5.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Godot V5 import and source smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fantasia-v5-test/fantasia_first_home_25d
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/v5-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*script' /tmp/v5-import.log; then
            echo '[FAIL] Godot import generated errors'; exit 1
          fi
          for test in first_home_25d_smoke.gd ambient_godot_smoke.gd environment_v5_smoke.gd; do
            godot --headless --path . --script "res://tests/$test"
          done
      - name: Commit verified original-quality V5 archive to prototype branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/gpt_zero_home/25d_interactive/fantasia_first_home_25d_v5_dynamic.zip
          if git diff --cached --quiet; then
            echo '[V5] Archive already committed'
          else
            git commit -m "assets(25d): publish V5 ambient dynamics and foliage shader"
            git push origin "HEAD:prototype/ai-first-home"
          fi
      - name: Publish second ZIP download option as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: fantasia-first-home-v5-dynamic-original-art
          path: prototypes/gpt_zero_home/25d_interactive/fantasia_first_home_25d_v5_dynamic.zip
          retention-days: 30