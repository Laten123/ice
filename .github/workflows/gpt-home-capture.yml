name: AI-first home - real Godot screenshots

on:
  push:
    branches:
      - "prototype/ai-first-home"
    paths:
      - ".github/workflows/gpt-home-capture.yml"
      - "prototypes/gpt_zero_home/tests/capture.gd"
      - "prototypes/gpt_zero_home/scripts/home.gd"
      - "prototypes/gpt_zero_home/project.godot"
      - "prototypes/gpt_zero_home/tests/capture_public_viewer.gd"
      - "prototypes/gpt_zero_home/scenes/house_interior.tscn"
      - "prototypes/gpt_zero_home/scripts/house_interior.gd"
      - "prototypes/gpt_zero_home/scripts/home_spaces.gd"
      - "prototypes/gpt_zero_home/art/house_interior_*.svg"
      - "prototypes/gpt_zero_home/scripts/public_viewer.gd"
      - "prototypes/gpt_zero_home/scripts/observer_sprite.gd"
      - "prototypes/gpt_zero_home/scripts/resident_actor.gd"
      - "prototypes/gpt_zero_home/scripts/world_graph.gd"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and virtual screen
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 > /dev/null
      - name: Import assets for Godot
        run: godot --headless --path prototypes/gpt_zero_home --editor --import --quit
      - name: Take true in-engine snapshots (both time variants)
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x960x24" \
            godot --path prototypes/gpt_zero_home --rendering-driver opengl3 \
            --script res://tests/capture.gd 2>&1 | tee prototypes/gpt_zero_home/tests/capture-console.txt
          ls -lh prototypes/gpt_zero_home/preview-*.png
      - name: Capture read-only public viewer with fixture state
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x960x24" \
            godot --path prototypes/gpt_zero_home --rendering-driver opengl3 \
            --script res://tests/capture_public_viewer.gd 2>&1 | tee prototypes/gpt_zero_home/tests/public-viewer-capture-console.txt
          ls -lh prototypes/gpt_zero_home/preview-public-observer-*.png prototypes/gpt_zero_home/preview-house-interior-*.png
      - name: Upload screenshots for inspection
        uses: actions/upload-artifact@v4
        with:
          name: ai-first-home-godot-screenshots
          path: prototypes/gpt_zero_home/preview-*.png
      - name: Publish screenshot files to prototype branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/gpt_zero_home/preview-*.png prototypes/gpt_zero_home/tests/capture-console.txt prototypes/gpt_zero_home/tests/public-viewer-capture-console.txt
          if ! git diff --cached --quiet; then
            git commit -m "preview: render AI-first resident and phone layouts from Godot"
            git pull --rebase origin prototype/ai-first-home
            git push origin HEAD:prototype/ai-first-home
          fi
