name: GPT home - Capture real Godot screenshots

on:
  push:
    branches:
      - "prototype/gpt-zero-home"
    paths:
      - ".github/workflows/gpt-home-capture.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and virtual screen
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 > /dev/null
      - name: Import assets for Godot
        run: godot --headless --path prototypes/gpt_zero_home --editor --import --quit
      - name: Take true in-engine snapshots (both time variants)
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x960x24" \
            godot --path prototypes/gpt_zero_home --rendering-driver opengl3 \
            --script res://tests/capture.gd
          ls -lh prototypes/gpt_zero_home/preview-*.png
      - name: Upload screenshots for inspection
        uses: actions/upload-artifact@v4
        with:
          name: first-home-real-godot-screenshots
          path: prototypes/gpt_zero_home/preview-*.png
      - name: Publish screenshot files to prototype branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/gpt_zero_home/preview-*.png
          if ! git diff --cached --quiet; then
            git commit -m "preview: refresh desktop and phone captures for independent home"
            git push origin HEAD:prototype/gpt-zero-home
          fi
