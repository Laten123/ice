name: GPT independent home prototype - Godot 4.6.3

on:
  push:
    branches:
      - "prototype/gpt-zero-home"
      - "prototype/ai-first-home"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Verify and unpack reusable 16px pixel PNG atlas
        run: python3 prototypes/gpt_zero_home/tests/unpack_pixel_tile_atlas.py
      - name: Verify compact pixel V3 scene sources and export test previews
        run: |
          python3 prototypes/gpt_zero_home/tools/export_pixel_art_v3.py --check
          python3 prototypes/gpt_zero_home/tools/export_pixel_art_v3.py
      - name: Attach V3 pixel-art previews for visual approval
        uses: actions/upload-artifact@v4
        with:
          name: fantasia-first-home-v3-pixel-previews
          path: prototypes/gpt_zero_home/art/generated-v3/*.png
          retention-days: 7
      - name: Import the entirely independent project
        run: |
          set -o pipefail
          godot --headless --path prototypes/gpt_zero_home --editor --import --quit 2>&1 | tee /tmp/gpt-home-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*script" /tmp/gpt-home-import.log; then
            exit 1
          fi
      - name: Validate DeepSeek server test launcher
        run: bash -n prototypes/gpt_zero_home/tests/server_verify.sh
      - name: Validate isolated Godot Web staging export helper
        run: bash -n prototypes/gpt_zero_home/tests/export_staging_web.sh
      - name: Check temporary tunnel preview cannot expose resident APIs
        run: python3 prototypes/gpt_zero_home/tests/preview_public_server_smoke.py
      - name: Check responsive home and touch UI
        run: godot --headless --path prototypes/gpt_zero_home --script res://tests/smoke.gd
      - name: Check AI-resident navigation and refusal
        run: godot --headless --path prototypes/gpt_zero_home --script res://tests/agent_smoke.gd
      - name: Check trusted event boundary, receipts and replay protection
        run: godot --headless --path prototypes/gpt_zero_home --script res://tests/gateway_smoke.gd
      - name: Check scoped world observation and viewer independence
        run: godot --headless --path prototypes/gpt_zero_home --script res://tests/observation_smoke.gd
      - name: Check DeepSeek P1 place-ID compatibility
        run: godot --headless --path prototypes/gpt_zero_home --script res://tests/p1_contract_smoke.gd
      - name: Validate strictly read-only Godot public observer
        run: godot --headless --path prototypes/gpt_zero_home --script res://tests/public_viewer_smoke.gd
      - name: Check pixel material source and XML layer ordering
        run: python3 prototypes/gpt_zero_home/tests/pixel_ground_source_smoke.py
      - name: Verify native pixel grass river and path in both viewports
        run: godot --headless --path prototypes/gpt_zero_home --script res://tests/pixel_ground_smoke.gd
      - name: Validate all-pixel home and formal one-plot land scope
        run: godot --headless --path prototypes/gpt_zero_home --script res://tests/pixel_home_v3_smoke.gd
      - name: Validate indoor home anchors, room camera and consent-revocation semantics
        run: godot --headless --path prototypes/gpt_zero_home --script res://tests/home_room_smoke.gd
      - name: Validate installed wooden UI and original pixel stump
        run: godot --headless --path prototypes/gpt_zero_home --script res://tests/art_pack_smoke.gd
