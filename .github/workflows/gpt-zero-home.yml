name: GPT independent home prototype - Godot 4.6.3

on:
  push:
    branches:
      - "prototype/gpt-zero-home"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  home:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import the entirely independent project
        run: |
          set -o pipefail
          godot --headless --path prototypes/gpt_zero_home --editor --import --quit 2>&1 | tee /tmp/gpt-home-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*script" /tmp/gpt-home-import.log; then
            exit 1
          fi
      - name: Check standalone scene and lighting switch
        shell: bash
        run: |
          set +e
          godot --headless --path prototypes/gpt_zero_home --script res://tests/smoke.gd > /tmp/gpt-home-smoke.log 2>&1
          result=$?
          cat /tmp/gpt-home-smoke.log
          if [ "$result" -ne 0 ]; then
            cp /tmp/gpt-home-smoke.log prototypes/gpt_zero_home/tests/ci_smoke_error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add prototypes/gpt_zero_home/tests/ci_smoke_error.txt
            git commit -m "diagnostics: preserve first mobile smoke error [skip ci]"
            git push origin HEAD:prototype/gpt-zero-home || true
            exit "$result"
          fi
          echo "SMOKE_CHECK_COMPLETE"
